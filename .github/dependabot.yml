version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per week for all low-risk dev-dependency patch/minor bumps.
      dev-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
      # One PR for production-dependency patch bumps (next, react, web-vitals …).
      prod-patch:
        dependency-type: production
        update-types:
          - patch
    # Majors and production minors stay as individual PRs so each gets its own
    # review; the auto-merge workflow explicitly refuses to merge them.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
