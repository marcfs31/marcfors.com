name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Author uses the developer mailbox
        run: |
          author=$(git log -1 --format='%ae')
          echo "HEAD author: $author"
          echo "$author" | grep -q '@marcfors.com'
          echo "$author" | grep -vi gmail
      - run: npm ci
      - run: npm run privacy
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
